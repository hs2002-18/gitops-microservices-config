apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.email: |
    host: smtp.gmail.com
    port: 587
    from: harshshrimali319@gmail.com
    username: $email-username
    password: $email-password

  template.app-sync-succeeded: |
    email:
      subject: "[Argo CD] {{.app.metadata.name}} - Sync Succeeded"
    message: |
      Application {{.app.metadata.name}} was successfully synced.

      Sync Status: {{.app.status.sync.status}}
      Health: {{.app.status.health.status}}

  template.app-sync-failed: |
    email:
      subject: "[Argo CD] {{.app.metadata.name}} - Sync Failed"
    message: |
      Application {{.app.metadata.name}} sync failed.

      Sync Status: {{.app.status.sync.status}}
      Health: {{.app.status.health.status}}

  trigger.on-sync-succeeded: |
    - description: Send email when application sync succeeds
      send:
        - app-sync-succeeded
      when: app.status.operationState.phase == 'Succeeded'

  trigger.on-sync-failed: |
    - description: Send email when application sync fails
      send:
        - app-sync-failed
      when: app.status.operationState.phase == 'Failed'