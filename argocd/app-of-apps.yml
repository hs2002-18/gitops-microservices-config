apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-apps
  namespace: argocd
spec:
  project: gitops-project

  source:
    repoURL: https://github.com/hs2002-18/gitops-microservices-config.git
    targetRevision: main
    path: argocd/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true