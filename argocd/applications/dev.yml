apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-dev
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.gmail: harshshrimali319@gmail.com
    notifications.argoproj.io/subscribe.on-sync-failed.gmail: harshshrimali319@gmail.com
spec:
  project: gitops-project

  source:
    repoURL: https://github.com/hs2002-18/gitops-microservices-config.git
    targetRevision: main
    path: helm/gitops-app

    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true